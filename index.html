<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>JOY — Создаем яркие моменты для Вас и Ваших детей</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="logo.png" alt="JOY" class="logo">
    <div class="phone">📞 +7 (938) 478‑28‑28</div>
</header>

<section class="hero">
    <h1>Детские праздники в Ростове‑на‑Дону</h1>
    <p>Аниматоры, шоу и праздники под ключ</p>
    <a href="#form" class="btn">Оставить заявку</a>
</section>

<section class="services">
    <h2>Наши услуги</h2>
    <div class="cards">
        <div class="card">🤡 Аниматоры</div>
        <div class="card">🫧 Шоу программы</div>
        <div class="card">🎩 Полросковые программы</div>
        <div class="card">🎂 Праздник под ключ</div>
    </div>
</section>

<section class="form" id="form">
    <h2>Заказать праздник</h2>
    <form>
        <input type="text" placeholder="Ваше имя" required>
        <input type="tel" placeholder="Телефон" required>
        <textarea placeholder="Комментарий"></textarea>
        <button type="submit">Отправить заявку</button>
    </form>
</section>

<footer>
    <p>JOY — студия детских праздников</p>
    <p>Ростов‑на‑Дону и область</p>
</footer>

</body>
</html>
